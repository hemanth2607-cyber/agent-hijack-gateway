name: Agent Hijack Shield CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: Test & Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio hypothesis bandit pip-audit

      - name: Security Scan (Bandit)
        run: |
          bandit -r app/ -ll

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit --no-deps -r requirements.txt

      - name: Run Test Suite (Pytest & Hypothesis)
        run: |
          pytest tests/ -v

      - name: Run Shield Detection Benchmark (Train & Benign)
        run: |
          python eval/run_eval.py
